# fly.io worker box for cash.trading — no HTTP service, two always-on processes.
# LIVE app: cash-trading-jdma7a (sjc). Redeploy after editing the scripts:
#   fly secrets set DATABASE_URL=... GEOMI_API_KEY=... CRANK_KEY=... -a cash-trading-jdma7a
#   fly deploy . -a cash-trading-jdma7a -c infra/fly/fly.toml \
#       --dockerfile infra/fly/Dockerfile --remote-only
# (build context = repo root so the Dockerfile finds scripts/ and infra/fly/)
app = "cash-trading-jdma7a"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[processes]
  crank = "node scripts/crank-loop.mjs"
  depth = "node scripts/depth-capture-worker.mjs"
  # Sealed-vault attestor: signs one signal per bar and submits tick_attested.
  # Requires secrets: SEALED_ATTESTOR_PRIVATE_KEY, SEALED_CRANK_PRIVATE_KEY,
  # and env SEALED_VAULT_PACKAGE + SEALED_STRATEGY_VAULT (+ SEALED_PINE_PRESET
  # or a mounted pine file). Starts at count 0; enable after the e2e deploy:
  #   fly scale count attestor=1 -a cash-trading-jdma7a
  attestor = "node --import /app/sealed/node_modules/tsx/dist/loader.mjs scripts/sealed-attestor-runner.ts live --package $SEALED_VAULT_PACKAGE --vault $SEALED_STRATEGY_VAULT --preset $SEALED_PINE_PRESET"

[env]
  CRANK_INTERVAL_S = "60"
  CAPTURE_INTERVAL_S = "15"   # ~86 MB/day across 39 markets
  DEPTH_LEVELS = "10"
  RETENTION_DAYS = "60"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["crank", "depth"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"          # transpiler + SDK need headroom over the .mjs workers
  processes = ["attestor"]

# Workers must never be auto-stopped.
[machine]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
