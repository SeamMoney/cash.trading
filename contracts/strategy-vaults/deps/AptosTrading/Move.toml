# Compile-time interface mirroring the on-chain `AptosTrading` package, which owns
# order_book_types. Verified 2026-07-30: the current Decibel package resolves this at the
# framework address 0x5, NOT the standalone 0xb4e85b13… the old package used.
# Name MUST match the on-chain package so the publish-time dependency check (0x1::code)
# resolves it. Never published; stubs only.
[package]
name = "AptosTrading"
version = "0.1.0"

[addresses]
order_book = "0x5"

[dependencies]
AptosFramework = { git = "https://github.com/aptos-labs/aptos-core.git", subdir = "aptos-move/framework/aptos-framework", rev = "mainnet" }
